<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="VoxRadar: mira quién habla y desde dónde en una reunión grupal. Prototipo para personas con hipoacusia." />
    <meta name="theme-color" content="#0e2433" />
    <title>VoxRadar</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preload" href="src/fonts/AtkinsonHyperlegible-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/screens.css" />
  </head>
  <body>
    <main id="app" aria-live="off"></main>
    <div id="overlay-root"></div>
    <p id="announcer" class="sr-only" aria-live="polite"></p>
    <noscript><p>VoxRadar necesita JavaScript para funcionar.</p></noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
